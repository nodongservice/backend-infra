groups:
  - name: bridgework-availability
    interval: 30s
    rules:
      - alert: SpringBackendDown
        expr: up{job="spring-backend"} == 0
        for: 2m
        labels:
          severity: critical
          target: spring-backend
        annotations:
          summary: "Spring backend 메트릭 수집 불가"
          description: "2분 이상 Spring backend /actuator/prometheus 응답이 없습니다."

      - alert: FastApiDown
        expr: up{job="fastapi"} == 0
        for: 2m
        labels:
          severity: critical
          target: fastapi
        annotations:
          summary: "FastAPI 메트릭 수집 불가"
          description: "2분 이상 FastAPI /metrics 응답이 없습니다."

      - alert: SpringHigh5xxRate
        expr: sum(rate(http_server_requests_seconds_count{job="spring-backend",status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count{job="spring-backend"}[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: warning
          target: spring-backend
        annotations:
          summary: "Spring 5xx 비율 상승"
          description: "최근 5분 기준 Spring 5xx 비율이 5%를 초과했습니다."

      - alert: RootDiskSpaceLow
        expr: node_filesystem_avail_bytes{job="node-exporter",mountpoint="/"} / node_filesystem_size_bytes{job="node-exporter",mountpoint="/"} < 0.20
        for: 10m
        labels:
          severity: warning
          target: ec2-root-disk
        annotations:
          summary: "EC2 루트 디스크 여유 공간 부족"
          description: "루트 디스크의 가용 공간이 10분 이상 20% 미만입니다."

      - alert: RootDiskSpaceCritical
        expr: node_filesystem_avail_bytes{job="node-exporter",mountpoint="/"} / node_filesystem_size_bytes{job="node-exporter",mountpoint="/"} < 0.10
        for: 2m
        labels:
          severity: critical
          target: ec2-root-disk
        annotations:
          summary: "EC2 루트 디스크 고갈 임박"
          description: "루트 디스크의 가용 공간이 2분 이상 10% 미만입니다."
