global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/bridgework-rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: spring-backend
    metrics_path: /api/java/actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal"]

  - job_name: fastapi
    metrics_path: /api/py/metrics
    static_configs:
      - targets: ["host.docker.internal"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
