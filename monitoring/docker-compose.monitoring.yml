services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: bridgework-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/bridgework-rules.yml:/etc/prometheus/bridgework-rules.yml:ro
      - bridgework-prometheus-data:/prometheus
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:3.2.1
    container_name: bridgework-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - bridgework-loki-data:/loki
    ports:
      - "3100:3100"

  alloy:
    image: grafana/alloy:v1.8.2
    container_name: bridgework-alloy
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - bridgework-alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
    ports:
      - "12345:12345"

  grafana:
    image: grafana/grafana:11.2.2
    container_name: bridgework-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_SERVER_ROOT_URL: ${GRAFANA_PUBLIC_URL:-http://localhost:3000}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ALERTING_ENABLED: "true"
      INFRA_ALERT_DISCORD_WEBHOOK_URL: ${INFRA_ALERT_DISCORD_WEBHOOK_URL:-}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - bridgework-grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    ports:
      - "3000:3000"

volumes:
  bridgework-prometheus-data:
  bridgework-loki-data:
  bridgework-alloy-data:
  bridgework-grafana-data:
