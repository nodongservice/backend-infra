include /etc/nginx/conf.d/bridgework-upstream.inc;
include /etc/nginx/conf.d/fastapi-upstream.inc;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 모든 HTTP 요청을 정규 운영 도메인 HTTPS로 강제 전환한다.
    return 301 https://api.bridgework.cloud$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.bridgework.cloud;

    ssl_certificate /etc/letsencrypt/live/api.bridgework.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.bridgework.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 비정규 Host 접근은 운영 도메인으로 통일한다.
    if ($host != "api.bridgework.cloud") {
        return 301 https://api.bridgework.cloud$request_uri;
    }

    # 인증서 발급 후 브라우저가 HTTPS를 우선 사용하도록 강제한다.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 20m;

    # Spring Swagger UI 엔트리 포인트를 java 네임스페이스로 고정한다.
    location = /api/java/docs {
        return 308 /api/java/swagger-ui.html;
    }

    location = /api/java/docs/ {
        return 308 /api/java/swagger-ui.html;
    }

    location = /api/java/swagger-ui.html {
        return 308 /api/java/swagger-ui/index.html?configUrl=/api/java/v3/api-docs/swagger-config;
    }

    # index.html 직접 접근 시 configUrl가 없을 때만 엔트리 포인트로 유도한다.
    location = /api/java/swagger-ui/index.html {
        if ($arg_configUrl = "") {
            return 308 /api/java/swagger-ui.html;
        }
        proxy_pass http://bridgework_backend/swagger-ui/index.html;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix /api/java;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # 디렉터리 경로 접근은 고정 엔트리 포인트로 유도한다.
    location = /api/java/swagger-ui/ {
        return 308 /api/java/swagger-ui.html;
    }

    # Spring Swagger 정적 리소스를 java 네임스페이스로 전달한다.
    location /api/java/swagger-ui/ {
        proxy_pass http://bridgework_backend/swagger-ui/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix /api/java;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # Spring OpenAPI 문서를 java 네임스페이스로 전달한다.
    location = /api/java/v3/api-docs {
        proxy_pass http://bridgework_backend/v3/api-docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix /api/java;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # 일부 swagger-ui 환경은 prefix 없이 기본 경로(/v3/api-docs/*)를 조회하므로 호환 라우트를 둔다.
    location = /v3/api-docs {
        proxy_pass http://bridgework_backend/v3/api-docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix /api/java;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    location /v3/api-docs/ {
        proxy_pass http://bridgework_backend/v3/api-docs/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix /api/java;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    location /api/java/v3/api-docs/ {
        proxy_pass http://bridgework_backend/v3/api-docs/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix /api/java;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    location = /api/java/v3/api-docs.yaml {
        proxy_pass http://bridgework_backend/v3/api-docs.yaml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix /api/java;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # FastAPI Swagger 엔트리 포인트를 py 네임스페이스로 고정한다.
    location = /api/py/swagger-ui.html {
        return 308 /api/py/docs;
    }

    location = /api/py/docs/ {
        return 308 /api/py/docs;
    }

    # FastAPI docs 기본 openapi URL(/openapi.json)을 py 네임스페이스로 재작성한다.
    location = /api/py/docs {
        proxy_pass http://bridgework_fastapi_backend/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Accept-Encoding "";
        proxy_set_header X-Forwarded-Prefix /api/py;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        sub_filter_once off;
        sub_filter "url: '/openapi.json'" "url: '/api/py/openapi.json'";
        sub_filter 'url: "/openapi.json"' 'url: "/api/py/openapi.json"';
        sub_filter "oauth2RedirectUrl: window.location.origin + '/docs/oauth2-redirect'" "oauth2RedirectUrl: window.location.origin + '/api/py/docs/oauth2-redirect'";
    }

    location = /api/py/docs/oauth2-redirect {
        proxy_pass http://bridgework_fastapi_backend/docs/oauth2-redirect;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix /api/py;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    location = /api/py/openapi.json {
        proxy_pass http://bridgework_fastapi_backend/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix /api/py;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # Spring API는 /api/java/v1/* 경로를 /api/v1/*로 매핑한다.
    location = /api/java/v1 {
        return 308 /api/java/v1/;
    }

    # OpenAPI servers가 /api/java로 잡힌 구버전 호출(/api/java/api/v1/*)도 호환한다.
    location = /api/java/api/v1 {
        return 308 /api/java/api/v1/;
    }

    # 수동 동기화 실행은 장시간 처리될 수 있어 별도 타임아웃을 적용한다.
    location = /api/java/v1/sync/public-data/run {
        proxy_pass http://bridgework_backend/api/v1/sync/public-data/run;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    location /api/java/v1/ {
        proxy_pass http://bridgework_backend/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Spring Actuator 관측 엔드포인트를 외부 네임스페이스로 고정한다.
    location = /api/java/actuator {
        return 308 /api/java/actuator/;
    }

    location /api/java/actuator/ {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass http://bridgework_backend/actuator/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    location /api/java/api/v1/ {
        proxy_pass http://bridgework_backend/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # OpenAPI 기본 servers("/") 기준 호출 호환을 위해 /api/v1/*도 직접 매핑한다.
    location = /api/v1 {
        return 308 /api/v1/;
    }

    # Swagger UI가 기본 servers("/") 기준으로 호출하는 경로도 동일하게 장시간 타임아웃을 적용한다.
    location = /api/v1/sync/public-data/run {
        proxy_pass http://bridgework_backend/api/v1/sync/public-data/run;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    location /api/v1/ {
        proxy_pass http://bridgework_backend/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # FastAPI는 /api/py/v1/* 경로를 /api/v1/*로 매핑한다.
    location = /api/py/v1 {
        return 308 /api/py/v1/;
    }

    # OpenAPI servers가 /api/py로 잡힌 구버전 호출(/api/py/api/v1/*)도 호환한다.
    location = /api/py/api/v1 {
        return 308 /api/py/api/v1/;
    }

    location /api/py/v1/ {
        proxy_pass http://bridgework_fastapi_backend/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /api/py/api/v1/ {
        proxy_pass http://bridgework_fastapi_backend/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # FastAPI 헬스/메트릭 엔드포인트를 외부 네임스페이스로 제공한다.
    location = /api/py/health {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass http://bridgework_fastapi_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    location = /api/py/db-health {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass http://bridgework_fastapi_backend/db-health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    location = /api/py/postgis-health {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass http://bridgework_fastapi_backend/postgis-health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    location = /api/py/metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass http://bridgework_fastapi_backend/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # Grafana UI는 /grafana 하위 경로로 프록시한다.
    location = /grafana {
        return 308 /grafana/;
    }

    # Grafana Live(websocket) 경로를 별도 처리한다.
    location /grafana/api/live/ {
        rewrite ^/grafana/(.*) /$1 break;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 3600s;
    }

    location /grafana/ {
        rewrite ^/grafana/(.*) /$1 break;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    location / {
        return 404;
    }
}
